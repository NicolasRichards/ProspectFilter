<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
<title>ProspectFilter app icon</title>

<rect width="1024" height="1024" fill="#448F38"/>

<!-- CROWD: 4 overlapping player silhouettes, left third -->
<g fill="#173D12">

  <g opacity="0.60">
    <circle cx="94" cy="398" r="36"/>
    <rect x="66" y="435" width="54" height="112" rx="6"/>
    <rect x="69" y="543" width="21" height="78"/>
    <rect x="99" y="543" width="21" height="78"/>
  </g>

  <g opacity="0.68">
    <circle cx="148" cy="380" r="41"/>
    <rect x="116" y="422" width="64" height="124" rx="6"/>
    <rect x="119" y="542" width="24" height="86"/>
    <rect x="152" y="542" width="24" height="86"/>
  </g>

  <g opacity="0.74">
    <circle cx="207" cy="362" r="44"/>
    <rect x="172" y="407" width="70" height="132" rx="6"/>
    <rect x="175" y="535" width="27" height="94"/>
    <rect x="211" y="535" width="27" height="94"/>
  </g>

  <g opacity="0.80">
    <circle cx="269" cy="373" r="42"/>
    <rect x="235" y="416" width="66" height="127" rx="6"/>
    <rect x="238" y="539" width="25" height="90"/>
    <rect x="272" y="539" width="25" height="90"/>
  </g>

</g>

<!-- FUNNEL: sideways, single combined path (body + spout) -->
<path fill="rgba(255,255,255,0.90)" d="M 328,230 L 328,794 L 600,512 Z"/>

<!-- RESULT: single generic baseball (original mark, not a league logo) -->
<g transform="translate(802,512)">
  <circle r="130" fill="#F5F1E6"/>
  <circle r="130" fill="none" stroke="#173D12" stroke-width="6" opacity="0.15"/>
  <!-- stitching arcs -->
  <path d="M -78,-104 A 150,150 0 0 0 -78,104" fill="none" stroke="#B23A2E" stroke-width="9" stroke-linecap="round"/>
  <path d="M 78,-104 A 150,150 0 0 1 78,104" fill="none" stroke="#B23A2E" stroke-width="9" stroke-linecap="round"/>
  <!-- stitch ticks, left seam -->
  <g stroke="#B23A2E" stroke-width="5" stroke-linecap="round">
    <line x1="-88" y1="-92" x2="-64" y2="-84"/>
    <line x1="-104" y1="-62" x2="-78" y2="-58"/>
    <line x1="-112" y1="-28" x2="-85" y2="-28"/>
    <line x1="-112" y1="8" x2="-85" y2="6"/>
    <line x1="-104" y1="42" x2="-78" y2="36"/>
    <line x1="-88" y1="72" x2="-64" y2="62"/>
  </g>
  <!-- stitch ticks, right seam -->
  <g stroke="#B23A2E" stroke-width="5" stroke-linecap="round">
    <line x1="88" y1="-92" x2="64" y2="-84"/>
    <line x1="104" y1="-62" x2="78" y2="-58"/>
    <line x1="112" y1="-28" x2="85" y2="-28"/>
    <line x1="112" y1="8" x2="85" y2="6"/>
    <line x1="104" y1="42" x2="78" y2="36"/>
    <line x1="88" y1="72" x2="64" y2="62"/>
  </g>
</g>

</svg>
